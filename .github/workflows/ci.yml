name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app and backend)
        run: npm run typecheck
      - name: Lint
        run: npx expo lint --max-warnings 0
      - name: Tests
        run: npm test
      - name: Dependency and config checks
        run: npx expo-doctor
        env:
          # Expo publishes new patch versions most weeks. That check compares against a live list, so it would turn
          # main red with no change on our side. It runs below instead, as a report that does not fail the build.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
      - name: Expo package versions (report only)
        run: npx expo install --check
        continue-on-error: true
